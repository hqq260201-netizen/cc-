<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Croft 开屏</title>
<style>
@font-face { font-family: "WenKai"; src: url("/v3/fonts/wenkai-gb.woff2") format("woff2"); font-display: block; }
/* 一屏一个开屏；字只写 Croft，副标是今天的日期 */
:root {
  --paper: #F3EFE7; --ink: #2A2722; --ink-2: #6F695E; --ink-3: #A49D90; --accent: #3F6B57;
  --warm: 242, 184, 102; --petal: 232, 164, 178; --clawd: #D97757;
  --ui: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --text: "WenKai", "Kaiti SC", "STKaiti", var(--ui);
  --slow: cubic-bezier(.2, .7, .1, 1);
}
:root.dark { --paper: #161513; --ink: #ECE6DA; --ink-2: #A9A296; --ink-3: #6E685E; --accent: #8DB8A3; --warm: 236, 176, 96; --petal: 214, 150, 166; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--paper); color: var(--ink); font-family: var(--ui); -webkit-tap-highlight-color: transparent; overflow: hidden; }

.stage { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(ellipse 80% 60% at 50% 45%, color-mix(in srgb, var(--accent) 5%, var(--paper)), var(--paper) 72%);
  transition: opacity .9s var(--slow), filter .9s var(--slow); }
.stage > .mark { position: relative; text-align: center; transition: transform 1.1s var(--slow); }
.stage.out { opacity: 0; filter: blur(6px); }
.stage.out > .mark { transform: scale(1.04); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

@keyframes mist { from { opacity: 0; filter: blur(10px); transform: translateY(6px); } to { opacity: 1; filter: blur(0); transform: none; } }
@keyframes fade { to { opacity: 1; } }
@keyframes grow { to { transform: scaleX(1); } }
@keyframes growY { to { transform: scaleY(1); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.word { font-family: var(--text); font-size: 44px; letter-spacing: .14em; padding-left: .14em; line-height: 1.1; }
.sub { font-size: 11px; letter-spacing: .4em; padding-left: .4em; color: var(--ink-3); }
.in { opacity: 0; animation: mist 1.5s var(--slow) forwards; }
.fadein { opacity: 0; animation: fade 1s ease-out forwards; }

/* 一盏灯 */
.lamp { position: relative; width: 6px; height: 6px; margin: 0 auto 34px; }
.lamp i { position: absolute; inset: 0; border-radius: 50%; background: rgb(var(--warm)); opacity: 0;
  box-shadow: 0 0 18px 6px rgba(var(--warm), .55); animation: fade 1.2s .1s ease-out forwards, breath 3.2s 1.4s ease-in-out infinite; }
.lamp b { position: absolute; left: 50%; top: 50%; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--warm), .16), rgba(var(--warm), 0) 62%); opacity: 0; animation: fade 1.8s .3s ease-out forwards; }
@keyframes breath { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
.lamp-rule { width: 72px; height: 1px; margin: 20px auto 14px; background: var(--ink-3); transform: scaleX(0); animation: grow 1.1s 1.3s var(--slow) forwards; }

/* 推门：单扇门往里开，加载好以后走进门里 */
.dw { position: relative; width: 58px; height: 100px; margin: 0 auto; transition: transform 1.15s cubic-bezier(.65, 0, .25, 1); }
.dw .halo { position: absolute; left: 50%; top: 62%; width: 230px; height: 230px; margin: -115px 0 0 -115px; border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--warm), .26), rgba(var(--warm), 0) 65%); opacity: 0; animation: fade 1.4s 1.2s ease-out forwards; }
.dw .door { position: absolute; inset: 0; border-radius: 29px 29px 0 0; overflow: hidden; perspective: 260px; }
.dw .room { position: absolute; inset: 0; background: linear-gradient(to top, rgba(var(--warm), .95), rgba(var(--warm), .42)); }
.dw .leaf { position: absolute; top: 0; bottom: 0; left: 0; right: 1.5px; transform-origin: left center;
  background: linear-gradient(90deg, color-mix(in srgb, var(--ink) 9%, var(--paper)), color-mix(in srgb, var(--ink) 4%, var(--paper)));
  animation: openOne 1.3s .95s cubic-bezier(.5, 0, .2, 1) forwards; }
.dw .leaf i { position: absolute; right: 7px; top: 60%; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); }
@keyframes openOne { to { transform: rotateY(-84deg); } }
.dw .frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s .1s cubic-bezier(.5, 0, .2, 1) forwards; }
.door-ground { width: 136px; height: 1px; margin: 0 auto 26px; background: var(--ink-3); opacity: 0; animation: fade 1s .5s forwards; }
.stage.v-door.out { opacity: 0; filter: none; transition: opacity .6s .75s ease; }
.stage.v-door.out > .mark { transform: none; }
.stage.v-door.out .dw { transform: scale(24); }
.stage.v-door.out .frame, .stage.v-door.out .door-ground, .stage.v-door.out .word, .stage.v-door.out .sub, .stage.v-door.out .halo { opacity: 0 !important; transition: opacity .3s; }

/* 月升 */
.sky { position: relative; width: 170px; height: 96px; margin: 0 auto; overflow: hidden; }
.moon { position: absolute; left: 50%; bottom: 0; width: 46px; height: 46px; margin-left: -23px; transform: translateY(64px); animation: moonup 1.9s .3s cubic-bezier(.25, .7, .2, 1) forwards; }
.moon svg { width: 100%; height: 100%; overflow: visible; }
.moon path { fill: rgb(var(--warm)); }
.moon::before { content: ""; position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%;
  background: radial-gradient(circle, rgba(var(--warm), .22), rgba(var(--warm), 0) 62%); }
@keyframes moonup { to { transform: translateY(-22px); } }
.hz { width: 170px; height: 1px; margin: 0 auto 30px; background: var(--ink-3); transform: scaleX(0); animation: grow 1.1s .1s var(--slow) forwards; }

/* 墨晕 */
.ink { position: absolute; left: 50%; top: 40%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--ink); filter: blur(3px);
  opacity: 0; animation: bloom 2s .1s cubic-bezier(.2, .8, .2, 1) forwards; }
@keyframes bloom { 0% { opacity: .4; transform: scale(.2); } 30% { opacity: .12; } 100% { opacity: .05; transform: scale(26); } }
.ink-word { position: relative; font-family: var(--text); font-size: 50px; opacity: 0; animation: inkin 1.6s .55s var(--slow) forwards; }
@keyframes inkin { from { opacity: 0; filter: blur(14px); letter-spacing: .6em; } to { opacity: 1; filter: blur(0); letter-spacing: .14em; } }
.brush { position: relative; display: block; width: 120px; height: 14px; margin: 14px auto 0; overflow: visible; }
.brush path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s 1.4s cubic-bezier(.6, 0, .2, 1) forwards; }

/* 鎏金：固定深色，不跟主题 */
.stage.v-gold { background: radial-gradient(ellipse 70% 55% at 50% 46%, #221B12, #0F0C08 75%); }
.gold-box { position: relative; padding: 34px 40px 26px; }
.gold-frame { position: absolute; inset: 0; border: 1px solid #8C7044; clip-path: inset(50% 50% 50% 50%); animation: frame 1.5s .1s cubic-bezier(.6, 0, .2, 1) forwards; }
@keyframes frame { to { clip-path: inset(0 0 0 0); } }
.gold-box .corner { position: absolute; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; background: #D9BC7E; transform: rotate(45deg); opacity: 0; animation: fade .6s 1.4s forwards; }
.gold-box .corner.t { top: -4px; } .gold-box .corner.b { bottom: -4px; }
.gold-word { font-family: var(--text); font-size: 52px; letter-spacing: .16em; padding-left: .16em; line-height: 1.1;
  background: linear-gradient(110deg, #7A5B28 0%, #D9BC7E 38%, #FFF4D6 50%, #D9BC7E 62%, #7A5B28 100%); background-size: 260% 100%; background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text; color: transparent; opacity: 0;
  animation: mist 1.4s .6s var(--slow) forwards, sheen 1.8s 1.1s ease-in-out forwards; }
@keyframes sheen { to { background-position: 0 0; } }
.gold-sub { margin-top: 12px; font-size: 10px; letter-spacing: .5em; padding-left: .5em; color: #9C8257; opacity: 0; animation: fade 1s 1.6s forwards; }

/* 蜡笔小屋 */
.crayon { width: 190px; height: auto; display: block; margin: 0 auto 6px; overflow: visible; }
.crayon .d { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .7s cubic-bezier(.5, 0, .3, 1) forwards; }
.crayon .f { opacity: 0; animation: fade .4s forwards; }
.crayon .rays { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.crayon .sun { transform-box: fill-box; transform-origin: center; animation: fade .4s .1s forwards, bob 1.6s .5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px) scale(1.05); } }
.pop { display: inline-flex; gap: 2px; font-family: var(--text); font-size: 50px; line-height: 1.1; }
.pop span { display: inline-block; opacity: 0; transform: scale(0); animation: popin .55s cubic-bezier(.3, 1.8, .5, 1) forwards, wig 1.4s ease-in-out infinite; }
@keyframes popin { to { opacity: 1; transform: scale(1) rotate(var(--r, 0deg)); } }
@keyframes wig { 50% { translate: 0 -3px; } }

/* Clawd */
.cl { position: relative; width: 300px; height: 300px; margin: -90px auto -18px; image-rendering: pixelated; }
.cl img { position: absolute; inset: 0; width: 100%; height: 100%; }
.cl .walk { transform: translateX(-75vw); animation: walkin 1.25s .1s cubic-bezier(.3, .6, .4, 1) forwards, hide 0s 1.35s forwards; }
@keyframes walkin { to { transform: none; } }
@keyframes hide { to { visibility: hidden; } }
.cl .wave { visibility: hidden; animation: show 0s 1.35s forwards; }
@keyframes show { to { visibility: visible; } }
.bubble { position: absolute; left: 196px; top: 150px; padding: 5px 10px; border-radius: 14px 14px 14px 4px; background: var(--ink); color: var(--paper);
  font-family: var(--text); font-size: 15px; white-space: nowrap; opacity: 0; transform: scale(.4); transform-origin: 0 100%; animation: popin .45s 1.6s cubic-bezier(.3, 1.8, .5, 1) forwards; }

/* 预览用的控制条 */
.bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 10px; align-items: center; z-index: 5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.bar button { font: 14px var(--ui); color: var(--ink-2); background: color-mix(in srgb, var(--ink) 6%, var(--paper)); border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
  border-radius: 999px; padding: 9px 14px; cursor: pointer; }
.bar button.main { color: var(--paper); background: var(--ink); border-color: var(--ink); padding: 11px 26px; font-size: 15px; }
.bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.list { display: none; } .list.open { display: flex; }
.list button { font-size: 13px; padding: 7px 12px; }
.tip { position: fixed; top: calc(18px + env(safe-area-inset-top)); left: 16px; right: 16px; text-align: center; font-size: 13px; color: var(--ink-3); z-index: 5; letter-spacing: .05em; transition: opacity .4s; }
.gold-on .tip, .gold-on .bar button:not(.main) { color: #9C8257; }
.gold-on .bar button:not(.main) { background: #1D1710; border-color: #3A2E1C; }
.gold-on .bar button.main { background: #D9BC7E; border-color: #D9BC7E; color: #1D1710; }
@media (prefers-reduced-motion: reduce) { .stage * { animation-duration: 1ms !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
<div class="tip" id="tip"></div>
<div class="stage" id="stage"></div>
<div class="bar">
  <div class="row list" id="list"></div>
  <div class="row">
    <button class="main" id="rand" type="button">随机打开</button>
    <button id="all" type="button">挨个看</button>
    <button id="dark" type="button">深色</button>
  </div>
</div>
<script>
const W = ['日', '一', '二', '三', '四', '五', '六'];
const now = new Date();
const DATE = (now.getMonth() + 1) + '月' + now.getDate() + '日 · 周' + W[now.getDay()];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dpr = Math.min(2, window.devicePixelRatio || 1);
function fit(cv) { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; const c = cv.getContext('2d'); c.scale(dpr, dpr); return c; }
const letters = (word, colors, start, step) => [...word].map((ch, i) =>
  `<span style="color:${colors[i % colors.length]};--r:${[-6, 4, -3, 5, -4][i % 5]}deg;animation-delay:${(start + i * step).toFixed(2)}s,${(start + 0.6 + i * 0.1).toFixed(2)}s">${ch}</span>`).join('');

const V = [
  { id: 'lamp', name: '一盏灯', html: () => `<div class="mark"><div class="lamp"><b></b><i></i></div>
      <div class="word in" style="animation-delay:.7s">Croft</div><div class="lamp-rule"></div><div class="sub fadein" style="animation-delay:1.6s">${DATE}</div></div>` },

  { id: 'door', name: '推门', html: () => `<div class="mark"><div class="dw"><div class="halo"></div>
      <div class="door"><div class="room"></div><div class="leaf"><i></i></div></div>
      <svg class="frame" viewBox="0 0 58 100" aria-hidden="true"><path pathLength="1" d="M.65 100 V29 A28.35 28.35 0 0 1 57.35 29 V100"/></svg></div>
      <div class="door-ground"></div><div class="word in" style="animation-delay:1.4s;font-size:38px">Croft</div>
      <div class="sub fadein" style="animation-delay:1.8s;margin-top:12px">${DATE}</div></div>` },

  { id: 'moon', name: '月升', html: () => `<div class="mark"><div class="sky"><div class="moon"><svg viewBox="0 0 46 46" aria-hidden="true"><path d="M30 4a20 20 0 1 0 12 30A16 16 0 1 1 30 4z"/></svg></div></div>
      <div class="hz"></div><div class="word in" style="animation-delay:1.2s;font-size:40px">Croft</div>
      <div class="sub fadein" style="animation-delay:1.6s;margin-top:14px">${DATE}</div></div>` },

  { id: 'ink', name: '墨晕', html: () => `<div class="mark"><div class="ink"></div><div class="ink-word">Croft</div>
      <svg class="brush" viewBox="0 0 120 14" aria-hidden="true"><path pathLength="1" d="M4 9 C 30 4, 70 12, 116 6"/></svg></div>` },

  { id: 'stars', name: '星河', html: () => `<canvas></canvas><div class="mark" style="margin-top:150px"><div class="sub fadein" style="animation-delay:1.7s">${DATE}</div></div>`,
    start(el) {
      // 满屏星点飘过来，聚成 Croft 的字形；离开时向四周散开
      const cv = el.querySelector('canvas'), c = fit(cv), w = innerWidth, h = innerHeight;
      const fs = Math.min(w * .3, 128), off = document.createElement('canvas'), oc = off.getContext('2d');
      off.width = w; off.height = h; oc.font = `${fs}px WenKai, serif`; oc.textAlign = 'center'; oc.textBaseline = 'middle'; oc.fillText('Croft', w / 2, h * .45);
      const data = oc.getImageData(0, 0, w, h).data, pts = [], gap = w < 500 ? 4 : 5;
      for (let y = 0; y < h; y += gap) for (let x = 0; x < w; x += gap) if (data[(y * w + x) * 4 + 3] > 128) pts.push([x, y]);
      const ink = css('--ink'), warm = css('--warm');
      const P = pts.slice(0, 1400).map(([tx, ty]) => ({ tx, ty, x: Math.random() * w, y: Math.random() * h, d: Math.random() * .6,
        r: Math.random() * .7 + .7, warm: Math.random() < .14, tw: Math.random() * 6 }));
      const S = Array.from({ length: 90 }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * .9 + .3, tw: Math.random() * 6 }));
      const t0 = performance.now(); let out = 0, raf;
      const ease = t => 1 - Math.pow(1 - t, 3);
      (function frame(t) {
        const s = (t - t0) / 1000; c.clearRect(0, 0, w, h);
        for (const p of S) { c.globalAlpha = .25 + .25 * Math.sin(s * 2 + p.tw); c.fillStyle = ink; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
        for (const p of P) {
          let k = ease(Math.min(1, Math.max(0, (s - p.d) / 1.5))), x = p.x + (p.tx - p.x) * k, y = p.y + (p.ty - p.y) * k, a = .25 + .75 * k;
          if (out) { const o = Math.min(1, (t - out) / 900), dx = p.tx - w / 2, dy = p.ty - h * .45; x = p.tx + dx * o * 1.6; y = p.ty + dy * o * 1.6; a *= 1 - o; }
          c.globalAlpha = a * (.8 + .2 * Math.sin(s * 3 + p.tw)); c.fillStyle = p.warm ? `rgb(${warm})` : ink;
          c.beginPath(); c.arc(x, y, p.r, 0, 7); c.fill();
        }
        raf = requestAnimationFrame(frame);
      })(t0);
      return { exit() { out = performance.now(); }, stop() { cancelAnimationFrame(raf); } };
    } },

  { id: 'petals', name: '落花', html: () => `<canvas></canvas><div class="mark"><div class="word in" style="animation-delay:.6s;font-size:48px">Croft</div>
      <div class="sub fadein" style="animation-delay:1.3s;margin-top:14px">${DATE}</div></div>`,
    start(el) {
      const cv = el.querySelector('canvas'), c = fit(cv), w = innerWidth, h = innerHeight, col = css('--petal');
      const P = Array.from({ length: 38 }, () => ({ x: Math.random() * w, y: Math.random() * h * 1.1 - h * .5, v: 45 + Math.random() * 55,
        a: 14 + Math.random() * 26, f: .6 + Math.random() * .9, ph: Math.random() * 6, s: 5 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * 3 }));
      let last = performance.now(), raf;
      (function frame(t) {
        const dt = Math.min(.05, (t - last) / 1000); last = t; c.clearRect(0, 0, w, h);
        for (const p of P) {
          p.y += p.v * dt; p.rot += p.vr * dt; p.ph += p.f * dt * 2;
          if (p.y > h + 20) { p.y = -20; p.x = Math.random() * w; }
          const x = p.x + Math.sin(p.ph) * p.a;
          c.save(); c.translate(x, p.y); c.rotate(p.rot); c.scale(1, .55 + .45 * Math.abs(Math.cos(p.ph)));
          c.globalAlpha = .85; c.fillStyle = `rgb(${col})`;
          c.beginPath(); c.moveTo(0, -p.s); c.quadraticCurveTo(p.s, -p.s * .2, 0, p.s); c.quadraticCurveTo(-p.s, -p.s * .2, 0, -p.s); c.fill(); c.restore();
        }
        raf = requestAnimationFrame(frame);
      })(last);
      return { stop() { cancelAnimationFrame(raf); } };
    } },

  { id: 'gold', name: '鎏金', html: () => `<div class="mark"><div class="gold-box">
      <div class="gold-frame"></div><i class="corner t"></i><i class="corner b"></i>
      <div class="gold-word">Croft</div><div class="gold-sub">${DATE}</div></div></div>` },

  { id: 'crayon', name: '蜡笔小屋', html: () => `<div class="mark">
      <svg class="crayon" viewBox="0 0 200 160" aria-hidden="true">
        <defs><filter id="cr"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter></defs>
        <g filter="url(#cr)">
          <g class="sun"><circle cx="164" cy="30" r="13" fill="#F2C14E"/>
            <g class="rays" stroke="#F2C14E" stroke-width="3.5" stroke-linecap="round"><path d="M164 8v-5M164 52v5M142 30h-5M186 30h5M148 14l-3-3M180 46l3 3M180 14l3-3M148 46l-3 3"/></g></g>
          <path class="d" pathLength="1" d="M50 72 V138 H138 V72" stroke="var(--ink)" stroke-width="4.5" style="animation-delay:.2s"/>
          <path class="d" pathLength="1" d="M38 78 L94 34 L150 78" stroke="#E07A5F" stroke-width="6" style="animation-delay:.55s"/>
          <rect class="f" x="83" y="100" width="22" height="38" rx="3" fill="#7FB069" style="animation-delay:.9s"/>
          <rect class="f" x="60" y="88" width="16" height="16" rx="2" fill="#F2C14E" style="animation-delay:1s"/>
          <rect class="f" x="112" y="88" width="16" height="16" rx="2" fill="#F2C14E" style="animation-delay:1.05s"/>
          <path class="d" pathLength="1" d="M8 144 q8 -8 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" stroke="#7FB069" stroke-width="4" style="animation-delay:.1s"/>
          <path class="d" pathLength="1" d="M124 50 V30 h10 V60" stroke="var(--ink)" stroke-width="4" style="animation-delay:.8s"/>
          <path class="d" pathLength="1" d="M129 24 q-8 -6 0 -12 q8 -6 0 -12" stroke="var(--ink-3)" stroke-width="3" style="animation-delay:1.2s"/>
        </g>
      </svg>
      <div class="pop">${letters('Croft', ['#E07A5F', '#E9A93B', '#7FB069', '#5B8DEF', '#C77DBB'], 1.15, .12)}</div></div>` },

  { id: 'clawd', name: 'Clawd', html: () => `<div class="mark"><div class="cl">
      <img class="walk" src="/pet-assets/clawd-full/clawd-mini-crabwalk.svg" alt="">
      <img class="wave" src="/pet-assets/clawd-full/croft-wave.svg" alt=""><div class="bubble">嗨～</div></div>
      <div class="pop" style="font-size:44px">${letters('Croft', ['var(--clawd)', 'var(--ink)'], 1.5, .1)}</div></div>` },
];

const tip = document.getElementById('tip'), list = document.getElementById('list');
let cur = document.getElementById('stage'), run = null, t1, t2, last = null;
try { last = localStorage.getItem('splash_last'); } catch (e) {}

function play(v) {
  clearTimeout(t1); clearTimeout(t2); if (run && run.stop) run.stop();
  const fresh = document.createElement('div');
  fresh.className = 'stage v-' + v.id; fresh.id = 'stage'; fresh.innerHTML = v.html();
  cur.replaceWith(fresh); cur = fresh;
  document.body.classList.toggle('gold-on', v.id === 'gold');
  run = v.start ? v.start(fresh) : null;
  tip.textContent = '';
  last = v.id; try { localStorage.setItem('splash_last', v.id); } catch (e) {}
  // 和 Croft 一样：停够 2.1 秒、加载好了再进首页
  t1 = setTimeout(() => { fresh.classList.add('out'); if (run && run.exit) run.exit(); }, 2600);
  t2 = setTimeout(() => { tip.textContent = '这次是 · ' + v.name; if (run && run.stop) run.stop(); }, 3700);
}
// 随机，但不会连着两次一样
function random() { const pool = V.filter(v => v.id !== last); play(pool[Math.floor(Math.random() * pool.length)]); }

V.forEach(v => { const b = document.createElement('button'); b.type = 'button'; b.textContent = v.name; b.onclick = () => play(v); list.appendChild(b); });
document.getElementById('rand').onclick = random;
document.getElementById('all').onclick = e => { const o = list.classList.toggle('open'); e.target.textContent = o ? '收起' : '挨个看'; };
document.getElementById('dark').onclick = e => {
  const on = document.documentElement.classList.toggle('dark'); e.target.textContent = on ? '浅色' : '深色';
  const v = V.find(x => x.id === last); if (v) play(v);
};
if (matchMedia('(prefers-color-scheme: dark)').matches) { document.documentElement.classList.add('dark'); document.getElementById('dark').textContent = '浅色'; }
document.fonts.load('44px WenKai', 'Croft').catch(() => {}).then(random);
</script>
</body>
</html>
