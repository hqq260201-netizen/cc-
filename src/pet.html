<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 120px; height: 130px; overflow: hidden; background: transparent; user-select: none; }

  #pet-wrap {
    width: 120px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    position: relative;
  }
  #pet-wrap:active { cursor: grabbing; }

  #crab {
    width: 110px;
    height: 110px;
    object-fit: contain;
    image-rendering: pixelated;
    pointer-events: none;
    transition: transform 0.2s ease;
  }

  /* ── Pet CSS animations (no extra GIFs needed) ── */
  #crab.waving {
    animation: wave 0.4s ease-in-out infinite alternate;
  }
  #crab.dancing {
    animation: dance 0.5s ease-in-out infinite;
  }
  #crab.excited {
    animation: excited 0.25s ease-in-out infinite alternate;
  }
  #crab.eating {
    animation: eat 0.3s ease-in-out infinite;
  }

  @keyframes wave {
    0%   { transform: rotate(-12deg) translateY(0); }
    100% { transform: rotate(12deg) translateY(-4px); }
  }
  @keyframes dance {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    25%  { transform: translateY(-8px) rotate(-8deg) scale(1.08); }
    50%  { transform: translateY(0) rotate(0deg) scale(1); }
    75%  { transform: translateY(-6px) rotate(8deg) scale(1.06); }
  }
  @keyframes excited {
    0%   { transform: translateY(0) scale(1); }
    100% { transform: translateY(-10px) scale(1.1); }
  }
  @keyframes eat {
    0%, 100% { transform: scale(1, 1); }
    50%  { transform: scale(1.08, 0.92); }
  }

  /* ── Context menu ── */
  #menu {
    display: none;
    position: fixed;
    top: 0; left: 0;
    background: rgba(18,14,26,0.94);
    border: 1px solid rgba(218,119,86,0.5);
    border-radius: 10px;
    padding: 6px 0;
    min-width: 138px;
    z-index: 9999;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.6);
    animation: popIn 0.14s ease;
  }
  #menu.visible { display: block; }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.82); }
    to   { opacity: 1; transform: scale(1); }
  }

  .menu-item {
    padding: 8px 16px;
    color: #f2d8cc;
    font-family: 'Microsoft YaHei', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.12s;
    white-space: nowrap;
  }
  .menu-item:hover { background: rgba(218,119,86,0.22); color: #fff; }
  .menu-item .ico  { font-size: 15px; width: 18px; text-align: center; }
  .menu-sep { height: 1px; background: rgba(255,255,255,0.07); margin: 3px 0; }

  #realtime-badge {
    font-size: 10px;
    background: #4caf50;
    color: #fff;
    border-radius: 4px;
    padding: 1px 5px;
  }
</style>
</head>
<body>
<div id="pet-wrap">
  <img id="crab" src="../assets/clawd-idle.gif" draggable="false" alt="Clawd"/>
</div>

<!-- context menu -->
<div id="menu">
  <div class="menu-item" id="btn-screenshot">
    <span class="ico">✂️</span> 截屏翻译
  </div>
  <div class="menu-item" id="btn-paste">
    <span class="ico">📋</span> 粘贴翻译
  </div>
  <div class="menu-sep"></div>
  <div class="menu-item" id="btn-realtime">
    <span class="ico" id="rt-ico">🔴</span> 实时翻译
    <span id="realtime-badge" style="display:none">ON</span>
  </div>
  <div class="menu-sep"></div>
  <div class="menu-item" id="btn-direction">
    <span class="ico" id="dir-ico">🔤</span> <span id="dir-label">英→中</span>
  </div>
  <div class="menu-sep"></div>
  <div class="menu-item" id="btn-quit">
    <span class="ico">🚪</span> 退出
  </div>
</div>

<script>
const crab = document.getElementById('crab');

const GIFS = {
  idle:        '../assets/clawd-idle.gif',
  working:     '../assets/clawd-building.gif',
  thinking:    '../assets/clawd-thinking.gif',
  typing:      '../assets/clawd-typing.gif',
  sleeping:    '../assets/clawd-sleeping.gif',
  happy:       '../assets/clawd-happy.gif',
  sweeping:    '../assets/clawd-sweeping.gif',
  carrying:    '../assets/clawd-carrying.gif',
  conducting:  '../assets/clawd-conducting.gif',
  debugger:    '../assets/clawd-debugger.gif',
  error:       '../assets/clawd-error.gif',
  reading:     '../assets/clawd-idle-reading.gif',
  juggling:    '../assets/clawd-juggling.gif',
  alert:       '../assets/clawd-mini-alert.gif',
  notice:      '../assets/clawd-notification.gif',
  annoyed:     '../assets/clawd-react-annoyed.gif',
  jump:        '../assets/clawd-react-double-jump.gif',
};

// CSS-only animation modes (no dedicated GIF)
const CSS_MODES = ['waving', 'dancing', 'excited', 'eating'];

const IDLE_VARIANTS = ['idle', 'reading', 'sweeping', 'juggling'];
let idleVariantTimer = null;
let modeTimer = null;
let currentMode = 'idle';
const PRIORITY = { working:5, thinking:4, happy:3, waving:2.5, dancing:2.5, excited:2.5, eating:2.5, typing:2, idle:1, sleeping:0 };

function startIdleVariants() {
  clearInterval(idleVariantTimer);
  idleVariantTimer = setInterval(() => {
    if (currentMode === 'idle' || currentMode === 'reading' || currentMode === 'sweeping' || currentMode === 'juggling') {
      const pool = IDLE_VARIANTS.filter(v => v !== currentMode);
      const next = pool[Math.floor(Math.random() * pool.length)];
      setMode(next, 0, true);
    }
  }, 25000); // swap every 25s
}

function stopIdleVariants() {
  clearInterval(idleVariantTimer);
  idleVariantTimer = null;
}

function setMode(m, duration = 0, force = false) {
  if (!force && (PRIORITY[m] || 0) < (PRIORITY[currentMode] || 0) && duration === 0) return;
  currentMode = m;

  // Manage idle variant cycling
  if (IDLE_VARIANTS.includes(m) || m === 'sleeping') {
    if (!idleVariantTimer) startIdleVariants();
  } else {
    stopIdleVariants();
  }

  // Remove all CSS animation classes
  crab.classList.remove(...CSS_MODES);

  if (CSS_MODES.includes(m)) {
    // Use idle GIF + CSS animation overlay
    crab.src = GIFS.idle + '?t=' + Date.now();
    crab.classList.add(m);
  } else {
    crab.src = (GIFS[m] || GIFS.idle) + '?t=' + Date.now();
  }

  if (modeTimer) { clearTimeout(modeTimer); modeTimer = null; }
  if (duration > 0) modeTimer = setTimeout(() => { currentMode = 'idle'; setMode('idle'); }, duration);
}

window.api.onSetMode((mode) => setMode(mode, 0, true));

// ── Drag ─────────────────────────────────────────────────────────────────
const wrap = document.getElementById('pet-wrap');
let dragging = false, moved = false;
let dragStartX = 0, dragStartY = 0;
let winStartX = 0, winStartY = 0;

wrap.addEventListener('mousedown', async (e) => {
  if (e.button !== 0) return;
  dragging = true; moved = false;
  dragStartX = e.screenX; dragStartY = e.screenY;
  const pos = await window.api.getPetPosition();
  winStartX = pos[0]; winStartY = pos[1];
});

window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.screenX - dragStartX, dy = e.screenY - dragStartY;
  if (!moved && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {
    moved = true;
    setMode('carrying', 0, true);
  }
  window.api.movePet({ x: winStartX + dx, y: winStartY + dy });
});

window.addEventListener('mouseup', () => {
  if (dragging && moved) {
    setTimeout(() => { if (currentMode === 'carrying') setMode('idle', 0, true); }, 300);
  }
  dragging = false;
});

// ── Context menu ─────────────────────────────────────────────────────────
const menu = document.getElementById('menu');
let realtimeOn = false;
let lastClickTime = 0;

wrap.addEventListener('click', (e) => {
  if (moved) { moved = false; return; }
  const now = Date.now();
  if (now - lastClickTime < 350) {
    // Double-click → juggling
    lastClickTime = 0;
    menu.classList.remove('visible');
    setMode('juggling', 3000, true);
    return;
  }
  lastClickTime = now;
  menu.style.left = '124px';
  menu.style.top = '10px';
  menu.classList.toggle('visible');
  e.stopPropagation();
});

document.addEventListener('click', () => menu.classList.remove('visible'));

document.getElementById('btn-screenshot').addEventListener('click', async (e) => {
  e.stopPropagation(); menu.classList.remove('visible');
  setMode('working', 30000); // 30s timeout fallback
  await window.api.startScreenshot();
});

document.getElementById('btn-paste').addEventListener('click', async (e) => {
  e.stopPropagation(); menu.classList.remove('visible');
  setMode('thinking');
  await window.api.translateClipboard();
  setMode('happy', 2500);
});

document.getElementById('btn-realtime').addEventListener('click', async (e) => {
  e.stopPropagation(); menu.classList.remove('visible');
  if (!realtimeOn) await window.api.startRealtime();
  else             await window.api.stopRealtime();
});

document.getElementById('btn-direction').addEventListener('click', async (e) => {
  e.stopPropagation(); menu.classList.remove('visible');
  const { isZh2En } = await window.api.toggleDirection();
  document.getElementById('dir-label').textContent = isZh2En ? '中→英' : '英→中';
});

document.getElementById('btn-quit').addEventListener('click', (e) => {
  e.stopPropagation(); menu.classList.remove('visible');
  window.api.quitApp();
});

window.api.onRealtimeStatus(({ on }) => {
  realtimeOn = on;
  document.getElementById('rt-ico').textContent = on ? '🟢' : '🔴';
  document.getElementById('realtime-badge').style.display = on ? 'inline' : 'none';
  setMode(on ? 'working' : 'idle', 0, true);
});

window.api.onUpdateTranslation(({ loading }) => {
  if (loading) setMode('thinking', 0, true);  // force override working
  else         setMode('happy', 2500, true);   // force override thinking
});
</script>
</body>
</html>
