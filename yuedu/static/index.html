<title>月渡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="程亭渡的记忆库">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap">
<!--YUEDU_API-->
<style>
/* Layout: phone first. Home is a grid of eight big category tiles over a night-ferry scene;
   a tile opens a list of one-line titles; a title opens a bottom sheet with the full text. */
:root {
  --ink: #0b1322; --ink-2: #121d31; --fg: #ece6d6; --mist: #93a2b4; --jin: #d6b46e; --zhu: #cc5a40;
  --qing: #5591bd; --lv: #62b29b;
  --card: color-mix(in oklab, var(--ink-2) 90%, transparent);
  --line: color-mix(in oklab, var(--fg) 12%, transparent);
  /* one hue per category, so a tile is recognised by colour before it is read */
  --c-today: #e8a95b; --c-diary: #6aa7d8; --c-stars: #e9cd78; --c-feel: #e3806e;
  --c-eye: #7cc4a8; --c-plans: #b49de0; --c-murmur: #8fc6d8; --c-all: #c9b89c;
  --sky-top: #050a15; --sky-low: #16253e; --water: #08111f; --ridge: #1b2c40;
  --display: "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", serif;
  --body: "Noto Serif SC", "Songti SC", "STSong", serif;
  --latin: "Cormorant Garamond", Georgia, serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --ink: #e7ece8; --ink-2: #fbfaf5; --fg: #1c2632; --mist: #5b6875; --jin: #8e6b22; --zhu: #b0412b; --qing: #2b6590; --lv: #2d7a66;
  --c-today: #b8701c; --c-diary: #2f6fa3; --c-stars: #a07d12; --c-feel: #b94a37;
  --c-eye: #2f8063; --c-plans: #6f52a8; --c-murmur: #2c7c93; --c-all: #7a6544;
  --sky-top: #b9cfd8; --sky-low: #efede4; --water: #c9d8d6; --ridge: #6f9a8b;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --ink: #e7ece8; --ink-2: #fbfaf5; --fg: #1c2632; --mist: #5b6875; --jin: #8e6b22; --zhu: #b0412b; --qing: #2b6590; --lv: #2d7a66;
  --c-today: #b8701c; --c-diary: #2f6fa3; --c-stars: #a07d12; --c-feel: #b94a37;
  --c-eye: #2f8063; --c-plans: #6f52a8; --c-murmur: #2c7c93; --c-all: #7a6544;
  --sky-top: #b9cfd8; --sky-low: #efede4; --water: #c9d8d6; --ridge: #6f9a8b;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font: 1rem/1.7 var(--body); -webkit-font-smoothing: antialiased; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.shell { position: relative; z-index: 1; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
.wrap { max-width: 640px; margin: 0 auto; }
button { font: inherit; color: inherit; }
.muted { color: var(--mist); }
:focus-visible { outline: 2px solid var(--jin); outline-offset: 2px; }

/* top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; padding-block: 12px; min-height: 44px; }
.seal { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border: 1.5px solid var(--zhu); color: var(--zhu); border-radius: 6px; font: 15px/1 var(--display); writing-mode: vertical-rl; background: color-mix(in oklab, var(--zhu) 8%, transparent); cursor: pointer; }
.back { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 1rem; }
.back svg { width: 18px; height: 18px; }

/* home */
.hello { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; padding-block: 4vh 14px; }
.hello h1 { margin: 0; font: 400 2.6rem/1.1 var(--display); letter-spacing: .04em; }
.hello span { color: var(--mist); font-size: .95rem; }
.note { all: unset; cursor: pointer; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; margin-bottom: 14px; border-radius: 14px; background: var(--card); border: 1px solid color-mix(in oklab, var(--zhu) 45%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.note .pin { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--zhu); background: color-mix(in oklab, var(--zhu) 14%, transparent); }
.note b { flex: 1; min-width: 0; font-weight: 600; }
.note small { display: block; color: var(--mist); font-weight: 400; font-size: .85rem; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { all: unset; cursor: pointer; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; min-height: 112px; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: transform .2s; position: relative; overflow: hidden; }
.tile::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: var(--c); opacity: .10; }
.tile:active { transform: scale(.97); }
.tile .ic { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--c); background: color-mix(in oklab, var(--c) 16%, transparent); }
.tile .ic svg { width: 26px; height: 26px; }
.tile b { align-self: end; font-size: 1.15rem; font-weight: 600; line-height: 1.3; }
.tile .n { font: 500 1.5rem/1 var(--latin); color: var(--c); font-variant-numeric: tabular-nums; }
.sample { display: block; text-align: center; margin-top: 18px; font-size: .8rem; color: var(--mist); }

/* list page */
.head { display: flex; align-items: center; gap: 14px; padding-block: 10px 14px; }
.head .ic { flex: none; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; color: var(--c); background: color-mix(in oklab, var(--c) 18%, transparent); }
.head .ic svg { width: 30px; height: 30px; }
.head h1 { margin: 0; font: 400 1.7rem/1.2 var(--display); }
.head p { margin: 0; color: var(--mist); font-size: .9rem; line-height: 1.5; }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip { all: unset; cursor: pointer; flex: none; padding: 6px 14px; border-radius: 999px; font-size: .9rem; background: var(--card); border: 1px solid var(--line); }
.fchip[aria-pressed="true"] { background: var(--c); color: var(--ink); border-color: var(--c); }
.search { box-sizing: border-box; width: 100%; margin-bottom: 12px; font: 1rem var(--body); color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; }
.list { display: grid; border-radius: 18px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); overflow: hidden; }
.row { all: unset; cursor: pointer; box-sizing: border-box; display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px 14px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .bar4 { align-self: stretch; border-radius: 2px; background: var(--c); }
.row .tt { font-size: 1.02rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .mt { display: block; color: var(--mist); font-size: .82rem; margin-top: 2px; }
.row .chev { color: var(--mist); width: 16px; height: 16px; }
.empty { padding: 28px 18px; color: var(--mist); text-align: center; }
.more { padding: 14px; text-align: center; color: var(--mist); font-size: .85rem; }

/* bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 15; background: rgba(4, 8, 16, .5); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; max-height: 88%; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--ink-2); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); transform: translateY(105%); transition: transform .35s cubic-bezier(.2, .7, .2, 1); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); max-width: 680px; margin: 0 auto; }
.sheet.open { transform: none; }
.sheet .grab { display: flex; justify-content: space-between; align-items: center; padding-block: 10px 6px; }
.sheet .grab i { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
.x { all: unset; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--card); font-size: 1.3rem; line-height: 1; color: var(--mist); }
.sheet .body { overflow-y: auto; padding-block: 4px 32px; display: grid; gap: 14px; align-content: start; }
.sheet h2 { margin: 0; font: 400 1.45rem/1.4 var(--display); }
.sheet .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--mist); font-size: .85rem; }
.tag { padding: 1px 10px; border-radius: 999px; color: var(--c); background: color-mix(in oklab, var(--c) 15%, transparent); font-size: .82rem; }
.sheet .txt { white-space: pre-line; font-size: 1.02rem; line-height: 1.85; }
.sheet blockquote { margin: 0; padding: 12px 16px; border-radius: 12px; background: color-mix(in oklab, var(--c) 10%, transparent); font: 1.15rem/1.6 var(--display); }
.btn { all: unset; cursor: pointer; justify-self: start; padding: 9px 18px; border-radius: 999px; background: var(--c); color: var(--ink); font-size: .95rem; }
.fade { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.fade i { display: block; height: 100%; background: var(--c); }
.sub { display: grid; gap: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
.sub h3 { margin: 6px 0 0; font-size: .85rem; font-weight: 400; color: var(--mist); }
.chat { display: grid; gap: 8px; }
.say { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: .98rem; line-height: 1.6; }
.say small { display: block; font-size: .72rem; color: var(--mist); }
.say.her { justify-self: start; background: color-mix(in oklab, var(--zhu) 14%, var(--ink-2)); border-bottom-left-radius: 4px; }
.say.me { justify-self: end; background: color-mix(in oklab, var(--qing) 16%, var(--ink-2)); border-bottom-right-radius: 4px; }
.evrow { all: unset; cursor: pointer; display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.evrow time { font: 500 1rem var(--latin); color: var(--mist); }

/* splash */
#splash { position: fixed; inset: 0; z-index: 50; background: #04070e; display: grid; place-items: center; cursor: pointer; transition: opacity .9s ease, visibility .9s; }
#splash.gone { opacity: 0; visibility: hidden; }
#splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#splash .title { position: relative; display: grid; justify-items: center; gap: 14px; margin-top: 34vh; color: #efe6cd; }
#splash .name { font: 60px/1 "ZCOOL XiaoWei", serif; letter-spacing: .3em; padding-left: .3em; opacity: 0; filter: blur(8px); animation: ink 1.3s 1.1s ease forwards; }
#splash .line2 { font-size: 15px; letter-spacing: .2em; color: #9fb0c4; opacity: 0; animation: fadein 1s 1.7s ease forwards; }
#splash .stamp { position: absolute; right: -50px; top: -4px; width: 32px; height: 32px; border: 2px solid #cc5a40; color: #cc5a40; display: grid; place-items: center; font: 14px/1 "ZCOOL XiaoWei", serif; border-radius: 3px; opacity: 0; transform: scale(1.8) rotate(-12deg); animation: stamp .35s 2.2s cubic-bezier(.3, 1.6, .5, 1) forwards; }
@keyframes ink { to { opacity: 1; filter: none; } }
@keyframes fadein { to { opacity: 1; } }
@keyframes stamp { to { opacity: .92; transform: scale(1) rotate(-8deg); } }

/* login */
.login { min-height: 70vh; display: grid; place-items: center; }
.login form { display: grid; gap: 14px; justify-items: center; width: min(320px, 100%); }
.login input { box-sizing: border-box; width: 100%; font: 1rem var(--body); color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; text-align: center; }

@media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } .wrap { max-width: 860px; } }
@media (max-width: 330px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  #splash .name, #splash .line2 { opacity: 1; filter: none; }
  #splash .stamp { opacity: .92; transform: rotate(-8deg); }
}
</style>

<canvas id="scene" aria-hidden="true"></canvas>

<div id="splash" role="button" tabindex="0" aria-label="进入">
  <canvas id="splashCanvas" aria-hidden="true"></canvas>
  <div class="title">
    <div style="position:relative"><div class="name">月渡</div><div class="stamp">渡</div></div>
    <div class="line2" id="splashLine">&nbsp;</div>
  </div>
</div>

<div class="shell">
  <div class="wrap">
    <header class="bar" id="bar"></header>
    <main id="view" aria-live="polite"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-label="详情">
  <div class="grab"><span style="width:36px"></span><i></i><button class="x" id="sheetX" aria-label="关闭">×</button></div>
  <div class="body" id="sheetBody"></div>
</section>

<script>
(() => {
"use strict";
const LIVE = !!window.YUEDU_API;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============ moon & lunar calendar ============ */
const SYN = 29.530588853;
function moonPhase(date) { // 0 new → .5 full → 1
  const jd = date.getTime() / 86400000 + 2440587.5;
  return (((jd - 2451550.1) / SYN) % 1 + 1) % 1;
}
function phaseName(f) {
  const n = ["朔月", "蛾眉月", "上弦月", "盈凸月", "望月", "亏凸月", "下弦月", "残月"];
  return n[Math.round(f * 8) % 8];
}
// Lit-region outline for a moon of radius r centred at 0,0, as SVG path data (also fed to Path2D).
function litPath(f, r) {
  const k = Math.cos(2 * Math.PI * f), rx = Math.abs(k) * r;
  if (f < 0.5) return `M0 ${-r}A${r} ${r} 0 0 1 0 ${r}A${rx} ${r} 0 0 ${k > 0 ? 0 : 1} 0 ${-r}Z`;
  return `M0 ${-r}A${r} ${r} 0 0 0 0 ${r}A${rx} ${r} 0 0 ${k > 0 ? 1 : 0} 0 ${-r}Z`;
}
const CN_DAY = ["", "初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
function lunarDate(date) {
  try {
    const parts = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", { year: "numeric", month: "long", day: "numeric" }).formatToParts(date);
    const get = t => (parts.find(p => p.type === t) || {}).value || "";
    const day = Number(get("day")) || 0;
    return { year: get("yearName") || "", month: get("month"), day: CN_DAY[day] || get("day") };
  } catch { return { year: "", month: "", day: "" }; }
}

/* ============ theme tokens for canvas ============ */
let T = {};
function readTokens() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ["ink", "ink-2", "fg", "mist", "jin", "qing", "lv", "zhu", "sky-top", "sky-low", "water", "ridge"]) T[k] = cs.getPropertyValue("--" + k).trim();
  T.dark = cs.getPropertyValue("color-scheme").includes("dark");
}
readTokens();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTokens(); buildRidges(); });
new MutationObserver(() => { readTokens(); buildRidges(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ============ seeded noise ============ */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function ridgeLine(seed, n, rough) {
  const r = rng(seed), pts = [];
  let v = r();
  for (let i = 0; i <= n; i++) { v += (r() - 0.5) * rough; v = Math.max(0, Math.min(1, v)); pts.push(v); }
  for (let pass = 0; pass < 3; pass++) for (let i = 1; i < n; i++) pts[i] = (pts[i - 1] + pts[i] * 2 + pts[i + 1]) / 4;
  return pts;
}

/* ============ the scene ============ */
const scene = $("#scene"), sx = scene.getContext("2d");
let W = 0, H = 0, DPR = 1, stars = [], ridges = [];
const today = new Date();
const PHASE = moonPhase(today);
const cam = { look: 0, target: 0 };
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  scene.width = W * DPR; scene.height = H * DPR;
  const r = rng(7); stars = Array.from({ length: Math.round(W * H / 4200) }, () => ({ x: r(), y: r(), s: r() * 1.2 + .2, p: r() * 6.28 }));
  buildRidges();
}
function buildRidges() {
  ridges = [
    { pts: ridgeLine(11, 48, .55), h: .16, mix: .35 },
    { pts: ridgeLine(23, 64, .45), h: .11, mix: .6 },
    { pts: ridgeLine(41, 90, .35), h: .06, mix: .85 },
  ];
}
function mixHex(a, b, t) {
  const p = h => { h = h.replace("#", ""); if (h.length === 3) h = [...h].map(c => c + c).join(""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
  try { const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",")})`; } catch { return a; }
}
function drawScene(t) {
  cam.look += (cam.target - cam.look) * 0.04;
  const g = sx; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const hz = H * (0.58 - cam.look * 0.42); // horizon
  // sky
  const sky = g.createLinearGradient(0, 0, 0, Math.max(1, hz));
  sky.addColorStop(0, T["sky-top"]); sky.addColorStop(1, T["sky-low"]);
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // stars
  if (T.dark) for (const s of stars) {
    const y = s.y * hz * 1.1 - cam.look * 60; if (y > hz - 8 || y < -4) continue;
    g.globalAlpha = .35 + .45 * Math.sin(t / 1400 + s.p) ** 2;
    g.fillStyle = "#f2ead2"; g.fillRect(s.x * W, y, s.s, s.s);
  }
  g.globalAlpha = 1;
  // moon
  const mr = Math.max(26, Math.min(W, H) * 0.055), mx = W * 0.78, my = Math.max(mr + 70, hz * 0.34);
  if (my + mr < hz) {
    const halo = g.createRadialGradient(mx, my, mr * .6, mx, my, mr * 5);
    halo.addColorStop(0, T.dark ? "rgba(240,220,160,.20)" : "rgba(255,255,240,.55)"); halo.addColorStop(1, "rgba(240,220,160,0)");
    g.fillStyle = halo; g.beginPath(); g.arc(mx, my, mr * 5, 0, 7); g.fill();
    g.save(); g.translate(mx, my);
    g.fillStyle = T.dark ? "rgba(150,165,190,.10)" : "rgba(120,140,150,.12)"; g.beginPath(); g.arc(0, 0, mr, 0, 7); g.fill();
    g.fillStyle = T.dark ? "#efdca8" : "#fffaf0"; g.fill(new Path2D(litPath(PHASE, mr)));
    g.restore();
  }
  // ridges: 青绿 mountains, far to near
  ridges.forEach((rd, i) => {
    const base = hz, top = H * rd.h;
    g.fillStyle = mixHex(T.ridge, i === 0 ? T.qing : T.lv, T.dark ? rd.mix * .25 : rd.mix * .35);
    g.globalAlpha = T.dark ? .55 + i * .15 : .45 + i * .18;
    g.beginPath(); g.moveTo(0, base);
    rd.pts.forEach((v, j) => g.lineTo(j / (rd.pts.length - 1) * W, base - v * top - (i === 0 ? top * .3 : 0)));
    g.lineTo(W, base); g.closePath(); g.fill();
  });
  g.globalAlpha = 1;
  // water
  const wg = g.createLinearGradient(0, hz, 0, H);
  wg.addColorStop(0, mixHex(T.water, T.qing, .18)); wg.addColorStop(1, T.water);
  g.fillStyle = wg; g.fillRect(0, hz, W, H - hz);
  // moon reflection: broken gold strokes
  g.fillStyle = T.dark ? "rgba(239,220,168,.55)" : "rgba(255,255,255,.75)";
  for (let k = 0; k < 26; k++) {
    const y = hz + 6 + k * k * 0.9; if (y > H) break;

    g.globalAlpha = (1 - k / 26) * .8;
    g.fillRect(mx - w / 2 + Math.sin(t / 900 + k) * 6, y, w, 1.2 + k * .05);
  }
  g.globalAlpha = 1;
  // ripples
  g.strokeStyle = T.dark ? "rgba(140,170,200,.10)" : "rgba(40,90,110,.12)"; g.lineWidth = 1;
  for (let k = 0; k < 14; k++) {

    g.beginPath();
    for (let x = 0; x <= W; x += 24) g.lineTo(x, y + Math.sin(x / 90 + t / 1600 + k) * (1 + k * .3));
    g.stroke();
  }
  // 书童's ferry with lantern, crossing slowly
  const bx = ((t / 90000) % 1) * (W + 160) - 80, by = hz + 22 + (H - hz) * .08;
  g.save(); g.translate(bx, by + Math.sin(t / 900) * 1.5);
  g.fillStyle = T.dark ? "#03060c" : "#2a3a40";
  g.beginPath(); g.moveTo(-26, 0); g.quadraticCurveTo(0, 9, 26, 0); g.lineTo(18, 0); g.quadraticCurveTo(0, 4, -18, 0); g.fill();
  g.fillRect(-1, -22, 1.4, 22); g.fillRect(-8, -9, 7, 9);
  const lg = g.createRadialGradient(10, -10, 0, 10, -10, 22);
  lg.addColorStop(0, "rgba(232,120,80,.9)"); lg.addColorStop(.15, "rgba(232,140,90,.5)"); lg.addColorStop(1, "rgba(232,140,90,0)");
  g.fillStyle = lg; g.beginPath(); g.arc(10, -10, 22, 0, 7); g.fill();
  g.restore();

  if (cam.look > 0.2) { g.fillStyle = mixHex(T.water, T.ink, .2); g.globalAlpha = Math.min(.6, (cam.look - .2)); g.fillRect(0, hz, W, H - hz); g.globalAlpha = 1; }
}

/* ============ splash: horizon draws, moon rises, name inks in ============ */
const splash = $("#splash");
function runSplash() {
  splash.classList.remove("gone");
  const L = lunarDate(today);
  $("#splashLine").textContent = `${L.year}${L.month}${L.day} · ${phaseName(PHASE)}`;
  const c = $("#splashCanvas"), g = c.getContext("2d");
  const w = innerWidth, h = innerHeight, d = Math.min(2, devicePixelRatio || 1);
  c.width = w * d; c.height = h * d; g.setTransform(d, 0, 0, d, 0, 0);
  const t0 = performance.now(), r = Math.min(w, h) * .085, cx = w / 2, hz = h * .5;
  let done = false;
  function frame(now) {
    if (done) return;
    const t = reduced ? 4 : Math.max(0, (now - t0) / 1000);
    g.fillStyle = "#04070e"; g.fillRect(0, 0, w, h);
    // ink bloom
    const bloom = Math.min(1, t / 1.4);
    const bg = g.createRadialGradient(cx, hz, 0, cx, hz, Math.max(w, h) * .7 * bloom + 1);
    bg.addColorStop(0, "rgba(28,48,78,.9)"); bg.addColorStop(1, "rgba(4,7,14,0)");
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    // moon rising from horizon
    const rise = Math.min(1, Math.max(0, (t - .5) / 1.6)), e = 1 - Math.pow(1 - rise, 3);
    const my = hz - (r * 1.6) * e - 4;
    g.save(); g.beginPath(); g.rect(0, 0, w, hz); g.clip();
    const halo = g.createRadialGradient(cx, my, r * .5, cx, my, r * 4);
    halo.addColorStop(0, `rgba(240,220,160,${.25 * e})`); halo.addColorStop(1, "rgba(240,220,160,0)");
    g.fillStyle = halo; g.fillRect(0, 0, w, hz);
    g.translate(cx, my);
    g.fillStyle = "rgba(150,165,190,.12)"; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
    g.fillStyle = "#efdca8"; g.fill(new Path2D(litPath(PHASE, r)));
    g.restore();
    // reflection
    for (let k = 0; k < 10; k++) { g.globalAlpha = .35 * e * (1 - k / 10); g.fillStyle = "#efdca8"; const ww = r * (1.4 - k * .1) * (0.7 + .3 * Math.sin(t * 3 + k)); g.fillRect(cx - ww / 2, hz + 6 + k * 7, ww, 1.2); }
    g.globalAlpha = 1;
    // horizon line drawing outward in gold
    const span = Math.min(1, t / .9) * w * .42;
    const lg = g.createLinearGradient(cx - span, 0, cx + span, 0);
    lg.addColorStop(0, "rgba(214,180,110,0)"); lg.addColorStop(.5, "rgba(214,180,110,.9)"); lg.addColorStop(1, "rgba(214,180,110,0)");
    g.fillStyle = lg; g.fillRect(cx - span, hz, span * 2, 1);
    if (t < 6) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const close = () => { if (done) return; done = true; splash.classList.add("gone"); };
  splash.onclick = close;
  splash.onkeydown = e => { if (e.key === "Enter" || e.key === " " || e.key === "Escape") close(); };
  setTimeout(close, reduced ? 800 : 3400);
}
runSplash();

async function api(path, params = {}) {
  if (!LIVE) {
    if (path === "home") return DEMO.home;
    if (path === "list") { const w = (params.q || "").trim(), it = DEMO.lists[params.cat] || []; const items = w ? it.filter(x => (x.title + x.body).includes(w)) : it; return { items, total: items.length }; }
    if (path === "day") return DEMO.day(params.date);
    if (path === "trace") return DEMO.trace(params.refs.split(","));
  }
  const q = new URLSearchParams(params).toString();
  const res = await fetch(`api/${path}${q ? "?" + q : ""}`, { credentials: "same-origin" });
  if (res.status === 401) { showLogin(); throw new Error("auth"); }
  if (!res.ok) throw new Error(`${path} ${res.status}`);
  return res.json();
}

/* ============ detail sheet ============ */
const sheet = $("#sheet"), scrim = $("#scrim");
function openSheet(html, color) {
  sheet.style.setProperty("--c", color);
  $("#sheetBody").innerHTML = html; $("#sheetBody").scrollTop = 0;
  sheet.classList.add("open"); scrim.classList.add("open"); sheet.setAttribute("aria-hidden", "false"); $("#sheetX").focus();
}
function closeSheet() { sheet.classList.remove("open"); scrim.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); }
$("#sheetX").onclick = closeSheet; scrim.onclick = closeSheet;
addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function openItem(x, k) {
  const color = `var(--c-${k})`;
  openSheet(`
    <span class="meta">${x.tag ? `<span class="tag">${esc(x.tag)}</span>` : ""}${esc(md(x.date))}${x.time ? " " + esc(x.time) : ""}</span>
    <h2>${esc(x.title)}</h2>
    ${x.fade != null ? `<div><div class="fade"><i style="width:${Math.round(x.fade * 100)}%"></i></div><span class="meta" style="margin-top:4px">${esc(x.note || "")}</span></div>` : ""}
    ${x.body && x.body !== x.title ? `<p class="txt">${esc(x.body)}</p>` : ""}
    ${x.quote ? `<blockquote>${esc(x.quote)}</blockquote>` : ""}
    ${(x.refs || []).length ? `<button class="btn" id="traceBtn">看当时的聊天</button><div id="traceBox"></div>` : ""}
    ${x.day ? `<div class="sub" id="dayBox"><h3>那天整理出的事</h3><p class="empty" style="padding:8px 0">正在打开……</p></div>` : ""}`, color);
  if ((x.refs || []).length) $("#traceBtn").onclick = () => showTrace(x.refs, $("#traceBox"), $("#traceBtn"));
  if (x.day) api("day", { date: x.day }).then(d => {
    const box = $("#dayBox"); if (!box) return;
    box.innerHTML = `<h3>那天整理出的事</h3>${(d.events || []).map((e, i) => `<button class="evrow" data-i="${i}"><time>${esc(e.time || "")}</time><span>${esc(e.title)}</span></button>`).join("") || `<p class="muted">那天没有整理出事件。</p>`}`;
    box.querySelectorAll(".evrow").forEach(b => b.onclick = () => openItem(d.events[+b.dataset.i], "today"));
  }).catch(() => {});
}
async function showTrace(refs, box, btn) {
  btn.hidden = true;
  box.innerHTML = `<p class="muted">正在找……</p>`;
  try {
    const d = await api("trace", { refs: refs.join(",") });
    const lines = (d.slices || []).flatMap(s => s.lines || []);
    box.innerHTML = lines.length ? `<div class="sub"><h3>当时的聊天</h3><div class="chat">${lines.map(l => `<div class="say ${l.who === "琪琪" ? "her" : "me"}"><small>${esc(l.who)}${l.at ? " " + esc(hm(l.at)) : ""}</small>${esc(l.text)}</div>`).join("")}</div></div>` : `<p class="muted">这段聊天还没整理好。</p>`;
  } catch (e) { if (e.message !== "auth") box.innerHTML = `<p class="muted">没打开：${esc(e.message)}</p>`; }
}
const hm = s => (s || "").slice(11, 16);

/* ============ routing ============ */
function go(k, push = true) {
  closeSheet();
  if (k !== "home" && !CAT[k]) k = "home";
  if (push) { state.filter = "全部"; state.q = ""; try { history.replaceState(null, "", "#" + k); } catch {} }
  view.innerHTML = `<p class="empty" style="padding-top:30vh">正在打开……</p>`;
  (k === "home" ? renderHome() : renderList(k)).catch(err => { if (err.message !== "auth") view.innerHTML = `<p class="empty">没打开：${esc(err.message)}。刷新试试。</p>`; });
  scrollTo({ top: 0 });
}

/* ============ login (live mode) ============ */
function showLogin() {
  cam.target = -.3; setBar("");
  view.innerHTML = `<div class="login"><form id="lf"><div class="seal" style="width:60px;height:60px;font-size:22px">月渡</div><label for="pw" class="muted">口令</label><input id="pw" type="password" autocomplete="current-password" required><button class="btn" style="--c:var(--jin);justify-self:center" type="submit">进入</button><p class="muted" id="lerr" style="min-height:1.5em"></p></form></div>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const r = await fetch("api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }), credentials: "same-origin" });
    if (r.ok) go("home"); else $("#lerr").textContent = "口令不对，再试一次。";
  };
}

let start = "home";
try { const h = location.hash.slice(1); if (CAT[h]) start = h; } catch {}
go(start, false);
})();
</script>
