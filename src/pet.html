<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 120px; height: 140px; overflow: hidden; background: transparent; user-select: none; }

  #pet-wrap {
    width: 120px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    position: relative;
  }
  #pet-wrap:active { cursor: grabbing; }

  /* ── Crab image ── */
  #crab {
    width: 100px;
    height: auto;
    image-rendering: pixelated;
    animation: bob 2s ease-in-out infinite;
    transform-origin: center bottom;
    transition: filter 0.3s;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-5px); }
  }

  #crab.happy {
    animation: bounce 0.4s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%       { transform: translateY(-8px) rotate(4deg); }
  }

  #crab.working {
    animation: shake 0.15s ease-in-out infinite;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%       { transform: translateX(-3px) rotate(-3deg); }
    75%       { transform: translateX(3px) rotate(3deg); }
  }

  /* ── Context menu ── */
  #menu {
    display: none;
    position: fixed;
    top: 0; left: 0;
    background: rgba(20,15,28,0.93);
    border: 1px solid rgba(218,119,86,0.5);
    border-radius: 10px;
    padding: 6px 0;
    min-width: 138px;
    z-index: 9999;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.55);
    animation: popIn 0.14s ease;
  }
  #menu.visible { display: block; }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.82); }
    to   { opacity: 1; transform: scale(1); }
  }

  .menu-item {
    padding: 8px 16px;
    color: #f2d8cc;
    font-family: 'Microsoft YaHei', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.12s;
    white-space: nowrap;
  }
  .menu-item:hover { background: rgba(218,119,86,0.22); color: #fff; }
  .menu-item .ico  { font-size: 15px; width: 18px; text-align: center; }
  .menu-sep { height: 1px; background: rgba(255,255,255,0.07); margin: 3px 0; }

  #realtime-badge {
    font-size: 10px;
    background: #4caf50;
    color: #fff;
    border-radius: 4px;
    padding: 1px 4px;
  }
</style>
</head>
<body>
<div id="pet-wrap">
  <img id="crab" src="../assets/crab.svg" draggable="false" alt="crab"/>
</div>

<!-- context menu -->
<div id="menu">
  <div class="menu-item" id="btn-screenshot">
    <span class="ico">✂️</span> 截屏翻译
  </div>
  <div class="menu-item" id="btn-paste">
    <span class="ico">📋</span> 粘贴翻译
  </div>
  <div class="menu-sep"></div>
  <div class="menu-item" id="btn-realtime">
    <span class="ico" id="rt-ico">🔴</span> 实时翻译
    <span id="realtime-badge" style="display:none">ON</span>
  </div>
</div>

<script>
// ── Crab animation state ──────────────────────────────────────────────────
const crab = document.getElementById('crab');
let modeTimer = null;

function setMode(m, duration = 0) {
  crab.className = m === 'idle' ? '' : m;
  if (modeTimer) { clearTimeout(modeTimer); modeTimer = null; }
  if (duration > 0) modeTimer = setTimeout(() => { crab.className = ''; }, duration);
}

// ── Drag ─────────────────────────────────────────────────────────────────
const wrap = document.getElementById('pet-wrap');
let dragging = false;
let dragStartX = 0, dragStartY = 0;
let winStartX = 0, winStartY = 0;

wrap.addEventListener('mousedown', async (e) => {
  if (e.button !== 0) return;
  dragging = true;
  dragStartX = e.screenX;
  dragStartY = e.screenY;
  const pos = await window.api.getPetPosition();
  winStartX = pos[0];
  winStartY = pos[1];
});

window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  window.api.movePet({ x: winStartX + e.screenX - dragStartX, y: winStartY + e.screenY - dragStartY });
});

window.addEventListener('mouseup', () => { dragging = false; });

// ── Context menu ─────────────────────────────────────────────────────────
const menu = document.getElementById('menu');
let realtimeOn = false;

wrap.addEventListener('click', (e) => {
  if (dragging) return;
  // Position menu to the right, or left if near screen edge
  menu.style.left = '124px';
  menu.style.top = '10px';
  menu.classList.add('visible');
  e.stopPropagation();
});

document.addEventListener('click', () => menu.classList.remove('visible'));

document.getElementById('btn-screenshot').addEventListener('click', async (e) => {
  e.stopPropagation();
  menu.classList.remove('visible');
  setMode('working');
  await window.api.startScreenshot();
});

document.getElementById('btn-paste').addEventListener('click', async (e) => {
  e.stopPropagation();
  menu.classList.remove('visible');
  setMode('working');
  await window.api.translateClipboard();
  setMode('happy', 3000);
});

document.getElementById('btn-realtime').addEventListener('click', async (e) => {
  e.stopPropagation();
  menu.classList.remove('visible');
  if (!realtimeOn) await window.api.startRealtime();
  else             await window.api.stopRealtime();
});

window.api.onRealtimeStatus(({ on }) => {
  realtimeOn = on;
  document.getElementById('rt-ico').textContent = on ? '🟢' : '🔴';
  const badge = document.getElementById('realtime-badge');
  badge.style.display = on ? 'inline' : 'none';
  if (on) setMode('happy'); else setMode('idle');
});

window.api.onUpdateTranslation(({ loading }) => {
  if (!loading) setMode('happy', 3000);
});
</script>
</body>
</html>
