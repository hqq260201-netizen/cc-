<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10" shape-rendering="crispEdges">
  <!-- Claude Code crab mascot — pixel art, transparent bg -->
  <!-- Color: #DA7756 (salmon-orange), eyes: #2D1000 -->

  <!-- Row 0: claw tips -->
  <rect fill="#DA7756" x="2"  y="0" width="1" height="1"/>
  <rect fill="#DA7756" x="13" y="0" width="1" height="1"/>

  <!-- Row 1: claw arms -->
  <rect fill="#DA7756" x="1"  y="1" width="3" height="1"/>
  <rect fill="#DA7756" x="12" y="1" width="3" height="1"/>

  <!-- Row 2: outer claws + body -->
  <rect fill="#DA7756" x="0"  y="2" width="2" height="1"/>
  <rect fill="#DA7756" x="4"  y="2" width="8" height="1"/>
  <rect fill="#DA7756" x="14" y="2" width="2" height="1"/>

  <!-- Row 3: outer claws + body with eyes -->
  <rect fill="#DA7756" x="0"  y="3" width="2" height="1"/>
  <rect fill="#DA7756" x="4"  y="3" width="2" height="1"/>
  <rect fill="#2D1000" x="6"  y="3" width="1" height="1"/>
  <rect fill="#DA7756" x="7"  y="3" width="2" height="1"/>
  <rect fill="#2D1000" x="9"  y="3" width="1" height="1"/>
  <rect fill="#DA7756" x="10" y="3" width="2" height="1"/>
  <rect fill="#DA7756" x="14" y="3" width="2" height="1"/>

  <!-- Row 4: lower claws + body -->
  <rect fill="#DA7756" x="1"  y="4" width="1" height="1"/>
  <rect fill="#DA7756" x="4"  y="4" width="8" height="1"/>
  <rect fill="#DA7756" x="14" y="4" width="1" height="1"/>

  <!-- Rows 5–6: body only -->
  <rect fill="#DA7756" x="4"  y="5" width="8" height="2"/>

  <!-- Row 7: leg starts (4 legs) -->
  <rect fill="#DA7756" x="4"  y="7" width="1" height="1"/>
  <rect fill="#DA7756" x="6"  y="7" width="1" height="1"/>
  <rect fill="#DA7756" x="9"  y="7" width="1" height="1"/>
  <rect fill="#DA7756" x="11" y="7" width="1" height="1"/>

  <!-- Row 8: legs spread -->
  <rect fill="#DA7756" x="3"  y="8" width="1" height="1"/>
  <rect fill="#DA7756" x="6"  y="8" width="1" height="1"/>
  <rect fill="#DA7756" x="9"  y="8" width="1" height="1"/>
  <rect fill="#DA7756" x="12" y="8" width="1" height="1"/>

  <!-- Row 9: leg tips -->
  <rect fill="#DA7756" x="2"  y="9" width="1" height="1"/>
  <rect fill="#DA7756" x="6"  y="9" width="1" height="1"/>
  <rect fill="#DA7756" x="9"  y="9" width="1" height="1"/>
  <rect fill="#DA7756" x="13" y="9" width="1" height="1"/>
</svg>
