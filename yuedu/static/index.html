<title>月渡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="程亭渡的记忆库：每天是一轮月，记忆按潮汐分层沉淀。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap">
<!--YUEDU_API-->
<style>
/* Layout: a living night ferry scene on a full-screen canvas behind; content floats over it
   as moonlit silk panels. Five single-character tabs move the camera: sky, horizon, water, depth. */
:root {
  --ink: #0b1322;         /* 黛：night sky ground */
  --ink-2: #111c30;       /* panel ground */
  --fg: #ebe5d5;          /* moonlit paper */
  --mist: #8d9db0;        /* secondary text */
  --jin: #d6b46e;         /* 泥金 gold leaf, the one accent */
  --qing: #5591bd;        /* 石青 azurite */
  --lv: #62b29b;          /* 石绿 malachite */
  --zhu: #cc5a40;         /* 朱砂 cinnabar, seals only */
  --panel: color-mix(in oklab, var(--ink-2) 78%, transparent);
  --line: color-mix(in oklab, var(--jin) 24%, transparent);
  --sky-top: #050a15; --sky-low: #16253e; --water: #08111f; --ridge: #1b2c40;
  --display: "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", serif;
  --body: "Noto Serif SC", "Songti SC", "STSong", serif;
  --latin: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --ink: #e6ebe7; --ink-2: #f5f4ee; --fg: #1c2632; --mist: #5a6875;
  --jin: #93702a; --qing: #2b6590; --lv: #2d7a66; --zhu: #b0412b;
  --sky-top: #b9cfd8; --sky-low: #efede4; --water: #c9d8d6; --ridge: #6f9a8b;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --ink: #e6ebe7; --ink-2: #f5f4ee; --fg: #1c2632; --mist: #5a6875;
  --jin: #93702a; --qing: #2b6590; --lv: #2d7a66; --zhu: #b0412b;
  --sky-top: #b9cfd8; --sky-low: #efede4; --water: #c9d8d6; --ridge: #6f9a8b;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font: 15px/1.85 var(--body); -webkit-font-smoothing: antialiased; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
.shell { position: relative; z-index: 1; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 72px; }
.wrap { max-width: 1080px; margin: 0 auto; }

/* ---------- header ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; }
.seal { display: grid; place-items: center; width: 44px; height: 44px; border: 1.5px solid var(--zhu); color: var(--zhu); border-radius: 6px; font: 17px/1 var(--display); writing-mode: vertical-rl; letter-spacing: .05em; background: color-mix(in oklab, var(--zhu) 8%, transparent); cursor: pointer; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand small { color: var(--mist); font: italic 14px/1.2 var(--latin); letter-spacing: .04em; white-space: nowrap; }
nav.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); }
nav.tabs button { all: unset; cursor: pointer; display: grid; justify-items: center; padding: 6px 13px 5px; border-radius: 999px; color: var(--mist); transition: color .3s, background .3s; }
nav.tabs button b { font: 19px/1.1 var(--display); font-weight: 400; }
nav.tabs button span { font-size: 10px; letter-spacing: .18em; line-height: 1.4; }
nav.tabs button[aria-selected="true"] { color: var(--ink); background: var(--jin); }
nav.tabs button:focus-visible, button:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--jin); outline-offset: 2px; }

/* ---------- shared pieces ---------- */
.panel { background: var(--panel); backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1); border: 1px solid var(--line); border-radius: 4px; padding: 22px 24px; min-width: 0; }
.eyebrow { font-size: 11px; letter-spacing: .28em; color: var(--jin); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
h2 { font-size: 24px; line-height: 1.3; }
h3 { font-size: 19px; line-height: 1.35; }
p { margin: 0; }
.muted { color: var(--mist); }
.num { font-family: var(--latin); font-variant-numeric: tabular-nums lining-nums; }
.chip { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font: 12px/1 var(--latin); letter-spacing: .04em; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--mist); transition: color .2s, border-color .2s; }
.chip:hover { color: var(--jin); border-color: var(--jin); }
.cat { font-size: 11px; letter-spacing: .2em; padding: 1px 7px; border-radius: 2px; color: var(--cat, var(--qing)); border: 1px solid color-mix(in oklab, var(--cat, var(--qing)) 45%, transparent); white-space: nowrap; }
.stack { display: grid; gap: 18px; }
.view { display: grid; gap: 22px; padding-top: 8px; animation: rise .7s cubic-bezier(.2,.7,.2,1); }
@keyframes rise { from { transform: translateY(10px); opacity: .4; } to { transform: none; opacity: 1; } }
.sample { justify-self: start; font-size: 12px; color: var(--mist); border: 1px dashed var(--line); border-radius: 999px; padding: 3px 12px; }

/* ---------- 夜 tonight ---------- */
.hero { display: grid; gap: 6px; padding-block: 36px 12px; }
.hero .lunar { font: 52px/1.1 var(--display); letter-spacing: .06em; }
.hero .sub { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--mist); }
.hero .sub .num { font-size: 20px; color: var(--fg); }
.tonight { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.letter { position: relative; padding: 26px 28px 24px; }
.letter::after { content: "便"; position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; display: grid; place-items: center; font: 16px/1 var(--display); color: var(--zhu); border: 1.5px solid var(--zhu); border-radius: 3px; transform: rotate(-6deg); opacity: .85; }
.letter p { font-size: 16px; line-height: 2; max-width: 34em; white-space: pre-line; }
.crossings { display: grid; gap: 0; }
.cross { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; padding-block: 16px; border-top: 1px solid var(--line); }
.cross:first-child { border-top: 0; }
.cross time { font: 18px/1.3 var(--latin); color: var(--jin); font-variant-numeric: tabular-nums; }
.cross time small { display: block; color: var(--mist); font-size: 13px; }
.cross .t { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.cross blockquote { margin: 8px 0 0; padding-left: 14px; border-left: 1px solid var(--jin); font: 18px/1.7 var(--display); color: var(--fg); }
.cross .refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.boy { display: grid; gap: 14px; }
.boy .row { display: flex; align-items: center; gap: 14px; }
.boy svg { flex: none; }
.funnel { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); text-align: center; border: 1px solid var(--line); border-radius: 3px; }
.funnel div { padding: 10px 4px; border-left: 1px solid var(--line); }
.funnel div:first-child { border-left: 0; }
.funnel .num { display: block; font-size: 26px; line-height: 1.1; color: var(--fg); }
.funnel small { font-size: 11px; letter-spacing: .14em; color: var(--mist); }
.mail { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid color-mix(in oklab, var(--zhu) 40%, transparent); border-radius: 3px; background: color-mix(in oklab, var(--zhu) 7%, transparent); }
.mail b { font-weight: 600; font-size: 14px; }
.boats { display: grid; gap: 10px; }
.boat { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: start; }
.boat .k { font-size: 11px; letter-spacing: .14em; padding-top: 4px; color: var(--lv); }
.boat .k.yue { color: var(--jin); }
.boat .k.xiang { color: var(--qing); }
.flies { display: grid; gap: 10px; }
.fly { display: grid; grid-template-columns: 8px minmax(0,1fr); gap: 10px; align-items: baseline; font-size: 14px; }
.fly i { width: 6px; height: 6px; border-radius: 50%; background: var(--jin); box-shadow: 0 0 10px var(--jin); animation: blink 3.2s ease-in-out infinite; transform: translateY(-2px); }
.fly:nth-child(2n) i { animation-delay: -1.1s; } .fly:nth-child(3n) i { animation-delay: -2.2s; }
@keyframes blink { 50% { opacity: .25; box-shadow: none; } }
.fly small { color: var(--mist); font-family: var(--latin); margin-left: 6px; }
.ledger { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
.ledger div { display: grid; gap: 2px; padding: 14px 0 0; border-top: 1px solid var(--line); }
.ledger .num { font-size: 30px; line-height: 1; }
.ledger small { color: var(--mist); font-size: 12px; letter-spacing: .1em; }

/* ---------- 潮 tide ---------- */
.intro { max-width: 40em; display: grid; gap: 10px; padding-top: 24px; }
.strata { display: grid; gap: 0; }
.stratum { display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 24px; padding: 26px 24px; border-top: 1px solid var(--line); background: color-mix(in oklab, var(--deep) 100%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.stratum:first-child { border-top: 0; border-radius: 4px 4px 0 0; }
.stratum:last-child { border-radius: 0 0 4px 4px; }
.stratum .gauge { display: grid; align-content: start; gap: 4px; }
.stratum .gauge b { font: 22px/1.2 var(--display); font-weight: 400; }
.stratum .gauge small { color: var(--mist); font-size: 12px; letter-spacing: .12em; }
.stratum .gauge .num { color: var(--jin); font-size: 15px; }
.stratum .items { display: grid; gap: 16px; min-width: 0; }
.tideitem { display: grid; gap: 4px; }
.tideitem .when { font: 15px/1.2 var(--latin); color: var(--jin); }
.tideitem p { max-width: 42em; }
.s0 { --deep: color-mix(in oklab, var(--ink-2) 70%, transparent); }
.s1 { --deep: color-mix(in oklab, color-mix(in oklab, var(--ink-2) 86%, var(--qing)) 76%, transparent); }
.s2 { --deep: color-mix(in oklab, color-mix(in oklab, var(--ink-2) 78%, var(--qing)) 82%, transparent); }
.s3 { --deep: color-mix(in oklab, color-mix(in oklab, var(--ink-2) 72%, var(--qing)) 88%, transparent); }
.s4 { --deep: color-mix(in oklab, color-mix(in oklab, var(--ink-2) 66%, var(--qing)) 94%, transparent); }
.s2 .tideitem p { font-size: 14px; } .s3 .tideitem p, .s4 .tideitem p { font: 17px/1.8 var(--display); }

/* ---------- 月 moons ---------- */
.monthbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 24px; }
.monthbar h2 { font-size: 30px; }
.monthbar .chip { font-size: 15px; padding: 6px 12px; }
.moongrid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; }
.moongrid .wd { text-align: center; font-size: 11px; letter-spacing: .2em; color: var(--mist); padding-bottom: 4px; }
.mday { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 10px 2px 8px; border-radius: 4px; border: 1px solid transparent; transition: background .2s, border-color .2s; }
.mday:hover { background: color-mix(in oklab, var(--jin) 8%, transparent); }
.mday[aria-pressed="true"] { border-color: var(--jin); background: color-mix(in oklab, var(--jin) 10%, transparent); }
.mday svg { width: 100%; max-width: 54px; height: auto; overflow: visible; }
.mday .d { font: 14px/1 var(--latin); color: var(--mist); font-variant-numeric: tabular-nums; }
.mday.empty { cursor: default; opacity: .35; }
.mday.today .d { color: var(--jin); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 12px; color: var(--mist); align-items: center; }
.legend .sw { display: inline-block; width: 22px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
.daypage { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 22px; align-items: start; }
.kindlist { display: grid; gap: 14px; }
.kind h4 { margin: 0 0 4px; font: 12px/1.4 var(--body); letter-spacing: .22em; color: var(--jin); font-weight: 400; }
.kind p { font-size: 14px; }

/* ---------- 星 stars ---------- */
.sky { width: 100%; height: auto; display: block; }
.sky .st { cursor: pointer; }
.sky .st:focus-visible path { stroke: var(--jin); stroke-width: 2; }
.starcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.starcard { all: unset; cursor: pointer; display: grid; gap: 6px; padding: 18px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.starcard[aria-pressed="true"] { border-color: var(--jin); }
.starcard .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--mist); }
.starcard p { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.starcard[aria-pressed="true"] p { -webkit-line-clamp: unset; }

/* ---------- 湖 lake ---------- */
.lakebox { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap: 22px; align-items: start; }
.lake { width: 100%; height: auto; display: block; touch-action: manipulation; }
.lake .ln { cursor: pointer; }
.domains { display: flex; flex-wrap: wrap; gap: 6px; }
.domains .chip[aria-pressed="true"] { color: var(--ink); background: var(--jin); border-color: var(--jin); }
.bucket { display: grid; gap: 10px; }
.bucket .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.bucket .tags span { font-size: 12px; color: var(--mist); }
.vital { height: 4px; border-radius: 2px; background: color-mix(in oklab, var(--mist) 25%, transparent); overflow: hidden; }
.vital i { display: block; height: 100%; background: linear-gradient(90deg, var(--qing), var(--jin)); }

/* ---------- drawer: 溯源 ---------- */
.drawer { position: fixed; z-index: 20; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--ink-2); border-left: 1px solid var(--line); transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.7,.2,1); display: grid; grid-template-rows: auto minmax(0,1fr); padding: calc(18px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) 22px; }
.drawer.open { transform: none; box-shadow: -30px 0 60px rgba(0,0,0,.35); }
.drawer header { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.drawer .body { overflow-y: auto; padding-block: 16px 30px; display: grid; gap: 22px; align-content: start; }
.rope { display: grid; gap: 10px; position: relative; padding-left: 18px; }
.rope::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: repeating-linear-gradient(var(--jin) 0 6px, transparent 6px 10px); }
.rope .addr { font: 15px/1 var(--latin); color: var(--jin); position: relative; }
.rope .addr::before { content: ""; position: absolute; left: -18px; top: 3px; width: 9px; height: 9px; border-radius: 50%; background: var(--ink-2); border: 1px solid var(--jin); }
.line { display: grid; grid-template-columns: 38px minmax(0,1fr); gap: 10px; font-size: 14px; }
.line .who { font-size: 12px; letter-spacing: .1em; padding-top: 3px; }
.line .who.her { color: var(--zhu); } .line .who.me { color: var(--qing); }
.line time { font: 12px var(--latin); color: var(--mist); margin-left: 6px; }
.x { all: unset; cursor: pointer; font: 22px/1 var(--latin); color: var(--mist); padding: 2px 6px; }
.scrim { position: fixed; inset: 0; z-index: 15; background: rgba(4,8,16,.45); opacity: 0; pointer-events: none; transition: opacity .4s; }
.scrim.open { opacity: 1; pointer-events: auto; }

/* ---------- splash ---------- */
#splash { position: fixed; inset: 0; z-index: 50; background: #04070e; display: grid; place-items: center; cursor: pointer; transition: opacity 1s ease, visibility 1s; }
#splash.gone { opacity: 0; visibility: hidden; }
#splash canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#splash .title { position: relative; display: grid; justify-items: center; gap: 14px; margin-top: 34vh; color: #efe6cd; }
#splash .name { font: 64px/1 "ZCOOL XiaoWei", serif; letter-spacing: .3em; padding-left: .3em; opacity: 0; filter: blur(8px); animation: ink 1.6s 1.7s ease forwards; }
#splash .line2 { font: italic 17px/1 "Cormorant Garamond", Georgia, serif; letter-spacing: .2em; color: #9fb0c4; opacity: 0; animation: fadein 1.2s 2.4s ease forwards; }
#splash .stamp { position: absolute; right: -54px; top: -6px; width: 34px; height: 34px; border: 2px solid #cc5a40; color: #cc5a40; display: grid; place-items: center; font: 15px/1 "ZCOOL XiaoWei", serif; border-radius: 3px; opacity: 0; transform: scale(1.8) rotate(-12deg); animation: stamp .35s 2.9s cubic-bezier(.3,1.6,.5,1) forwards; }
#splash .skip { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); font-size: 12px; letter-spacing: .3em; color: #5d6c80; }
@keyframes ink { to { opacity: 1; filter: none; } }
@keyframes fadein { to { opacity: 1; } }
@keyframes stamp { to { opacity: .92; transform: scale(1) rotate(-8deg); } }

/* ---------- login ---------- */
.login { min-height: 70vh; display: grid; place-items: center; }
.login form { display: grid; gap: 14px; justify-items: center; width: min(320px, 100%); }
.login input { width: 100%; box-sizing: border-box; font: 16px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 10px 14px; text-align: center; letter-spacing: .3em; }
.login button { all: unset; cursor: pointer; padding: 8px 26px; border-radius: 999px; background: var(--jin); color: var(--ink); letter-spacing: .3em; }

@media (max-width: 820px) {
  .tonight, .daypage, .lakebox { grid-template-columns: minmax(0,1fr); }
  .ledger { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stratum { grid-template-columns: minmax(0,1fr); gap: 12px; padding: 20px 18px; }
  .hero .lunar { font-size: 40px; }
}
@media (max-width: 560px) {
  header.bar { flex-wrap: wrap; }
  .brand small { display: none; }
  nav.tabs { width: 100%; justify-content: space-between; }
  nav.tabs button { padding: 5px 10px 4px; }
  .panel { padding: 18px 16px; }
  .letter { padding: 22px 18px 20px; }
  .cross { grid-template-columns: 52px minmax(0,1fr); gap: 12px; }
  #splash .name { font-size: 48px; }
  .mday { padding: 6px 0; }
  .mday .d { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  #splash .name, #splash .line2 { opacity: 1; filter: none; }
  #splash .stamp { opacity: .92; transform: rotate(-8deg); }
}
</style>

<canvas id="scene" aria-hidden="true"></canvas>

<div id="splash" role="button" tabindex="0" aria-label="进入月渡">
  <canvas id="splashCanvas" aria-hidden="true"></canvas>
  <div class="title">
    <div style="position:relative"><div class="name">月渡</div><div class="stamp">渡</div></div>
    <div class="line2" id="splashLine">&nbsp;</div>
  </div>
  <div class="skip">轻 触 入 渡</div>
</div>

<div class="shell">
  <div class="wrap">
    <header class="bar">
      <div class="brand">
        <div class="seal" id="sealBtn" title="重看开屏" role="button" tabindex="0">月渡</div>
        <small id="brandLine">a ferry of moons</small>
      </div>
      <nav class="tabs" role="tablist" aria-label="视图">
        <button role="tab" data-v="ye"><b>夜</b><span>今夜</span></button>
        <button role="tab" data-v="chao"><b>潮</b><span>潮汐</span></button>
        <button role="tab" data-v="yue"><b>月</b><span>月历</span></button>
        <button role="tab" data-v="xing"><b>星</b><span>星野</span></button>
        <button role="tab" data-v="hu"><b>湖</b><span>心湖</span></button>
      </nav>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="溯源" aria-hidden="true">
  <header>
    <div class="stack" style="gap:4px"><span class="eyebrow">溯 源</span><h3 id="drawerTitle">原话</h3></div>
    <button class="x" id="drawerClose" aria-label="关闭">×</button>
  </header>
  <div class="body" id="drawerBody"></div>
</aside>

<script>
(() => {
"use strict";
const LIVE = !!window.YUEDU_API;

const splash = $("#splash");

}

/* ============ data access ============ */
async function api(path, params = {}) {
  if (!LIVE) {
    if (path === "tonight") return DEMO.tonight;
    if (path === "tide") return DEMO.tide;
    if (path === "moons") return { days: Object.values(DEMO.moons).filter(d => d.date.startsWith(params.month)) };
    if (path === "day") return DEMO.day(params.date);
    if (path === "stars") return { stars: DEMO.stars };
    if (path === "lake") return DEMO.lake;
    if (path === "trace") return DEMO.trace(params.refs.split(","));
  }
  const q = new URLSearchParams(params).toString();
  const res = await fetch(`api/${path}${q ? "?" + q : ""}`, { credentials: "same-origin" });
  if (res.status === 401) { showLogin(); throw new Error("auth"); }
  if (!res.ok) throw new Error(`${path} ${res.status}`);
  return res.json();
}

const md = s => { const d = parseDay(s.slice(0, 10)); return `${d.getMonth() + 1}月${d.getDate()}日`; };
function moonSVG(date, size, opts = {}) {
  const f = moonPhase(parseDay(date)), r = size / 2 - 4;
  const val = opts.valence, glow = opts.glow ?? 0;
  const hue = val == null ? "var(--mist)" : val < .4 ? "var(--qing)" : val < .65 ? "var(--lv)" : val < .82 ? "var(--jin)" : "var(--zhu)";
  return `<svg viewBox="${-size / 2} ${-size / 2} ${size} ${size}" aria-hidden="true">
    ${glow ? `<circle r="${r + 3}" fill="none" style="stroke:${hue}" stroke-width="${1 + glow * 2.4}" opacity="${.25 + glow * .55}"/>` : ""}
    <circle r="${r}" style="fill:color-mix(in oklab, var(--mist) 16%, transparent)"/>
    <path d="${litPath(f, r)}" style="fill:var(--fg)" opacity="${opts.dim ? .35 : .92}"/></svg>`;
}

        <defs><radialGradient id="lg"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
        <line x1="${W2 / 2}" y1="${P}" x2="${W2 / 2}" y2="${H2 - P}" style="stroke:var(--line)"/><line x1="${P}" y1="${H2 / 2}" x2="${W2 - P}" y2="${H2 / 2}" style="stroke:var(--line)"/>
        <text x="${P}" y="${H2 / 2 - 8}" style="fill:var(--mist)" font-size="12">低落</text><text x="${W2 - P}" y="${H2 / 2 - 8}" style="fill:var(--mist)" font-size="12" text-anchor="end">明亮</text>
        <text x="${W2 / 2 + 8}" y="${P + 4}" style="fill:var(--mist)" font-size="12">激动</text><text x="${W2 / 2 + 8}" y="${H2 - P}" style="fill:var(--mist)" font-size="12">平静</text>
        ${list.map((x, i) => { const cx = P + x.valence * (W2 - 2 * P), cy = H2 - P - x.arousal * (H2 - 2 * P), r = 3 + x.importance * 1.2, c = dColor[x.domain] || "var(--fg)";
          return `<g class="ln" data-i="${i}" tabindex="0" transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)})" opacity="${(.2 + Math.sqrt(x.vitality) * .8).toFixed(2)}"><circle r="${r * 3}" style="fill:${c}" opacity=".12"/><circle r="${r}" style="fill:${c}"/>${i === lakeSel ? `<circle r="${r + 6}" fill="none" style="stroke:var(--fg)" stroke-width="1"/>` : ""}</g>`; }).join("")}
      </svg></section>
      <section class="panel bucket">${b ? `<span class="eyebrow">${esc(b.domain)} · 重要度 ${b.importance}/10</span><h2>${esc(b.title)}</h2>
        <div class="vital" title="还记得多少"><i style="width:${Math.round(b.vitality * 100)}%"></i></div>
        <p class="muted num" style="font-size:13px">还记得 ${Math.round(b.vitality * 100)}% · ${esc(md(b.created))}写下 · ${esc(md(b.last_active))}最后想起</p>
        <p style="font-size:14px;white-space:pre-line">${esc(b.body || "")}</p>
        <div class="tags">${(b.tags || []).map(t => `<span>#${esc(t)}</span>`).join("")}</div>` : `<p class="muted">这个分类里还没有灯。</p>`}
        <p class="muted" style="font-size:12px;border-top:1px solid var(--line);padding-top:10px">湖面 ${all.length} 盏 · 沉底存档 ${d.archived ?? "—"} · 永久 ${d.permanent ?? "—"}</p>
      </section>
    </div></div>`;
  view.querySelectorAll(".domains .chip").forEach(c => c.onclick = () => { lakeDomain = c.dataset.d; lakeSel = 0; renderLake(); });
  view.querySelectorAll(".ln").forEach(g => { const f = () => { lakeSel = +g.dataset.i; renderLake(); }; g.onclick = f; g.onkeydown = e => { if (e.key === "Enter") f(); }; });
}

/* ============ trace drawer ============ */
const drawer = $("#drawer"), scrim = $("#scrim");
function closeDrawer() { drawer.classList.remove("open"); scrim.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); }
$("#drawerClose").onclick = closeDrawer; scrim.onclick = closeDrawer;
addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
document.addEventListener("click", async e => {
  const c = e.target.closest("[data-refs]"); if (!c) return;
  $("#drawerTitle").textContent = c.dataset.title || "原话";
  $("#drawerBody").innerHTML = `<p class="muted">正沿着渡绳往回找……</p>`;
  drawer.classList.add("open"); scrim.classList.add("open"); drawer.setAttribute("aria-hidden", "false"); $("#drawerClose").focus();
  try {
    const d = await api("trace", { refs: c.dataset.refs });
    $("#drawerBody").innerHTML = (d.slices || []).map(s => `<div class="rope"><span class="addr">${esc(s.address)} <small class="muted">${esc(hm(s.time) || s.time || "")}</small></span>
      ${(s.lines || []).map(l => `<div class="line"><span class="who ${l.who === "琪琪" ? "her" : "me"}">${esc(l.who)}</span><p>${esc(l.text)}<time>${esc(hm(l.at) || "")}</time></p></div>`).join("")}</div>`).join("") || `<p class="muted">这几段原话没找到，可能还没封存。</p>`;
  } catch (err) { if (err.message !== "auth") $("#drawerBody").innerHTML = `<p class="muted">没取到原话：${esc(err.message)}</p>`; }
});

/* ============ login (live mode) ============ */
function showLogin() {
  cam.target = -.3;
  view.innerHTML = `<div class="login"><form id="lf"><div class="seal" style="width:64px;height:64px;font-size:24px">月渡</div><label for="pw" class="muted" style="letter-spacing:.3em;font-size:13px">口 令</label><input id="pw" type="password" autocomplete="current-password" required><button type="submit">入 渡</button><p class="muted" id="lerr" style="font-size:13px;min-height:1.5em"></p></form></div>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const r = await fetch("api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }), credentials: "same-origin" });
    if (r.ok) go(current); else $("#lerr").textContent = "口令不对，再试一次。";
  };
}

let start = "ye";
try { const h = location.hash.slice(1); if (VIEWS[h]) start = h; } catch {}
go(start, false);
})();
</script>
