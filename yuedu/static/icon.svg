<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#18304a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3dca0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f3dca0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <circle cx="38" cy="22" r="16" fill="url(#glow)"/>
  <!-- waxing gibbous: the lit side faces the ferry -->
  <path d="M38 12 A10 10 0 0 1 38 32 A5 10 0 0 1 38 12Z" fill="#e8cf8f"/>
  <!-- three strata of water: day, week, month -->
  <path d="M8 42 Q20 39 32 42 T56 42" stroke="#5fae98" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M8 49 Q20 46 32 49 T56 49" stroke="#4f8fb8" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M8 56 Q20 53 32 56 T56 56" stroke="#4f8fb8" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".45"/>
  <!-- the lantern on the ferry -->
  <circle cx="17" cy="37" r="2.6" fill="#c8553d"/>
</svg>
